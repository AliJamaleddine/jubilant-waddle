<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Explore</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading screen -->
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-orb"></div>
      <p class="loader-text">Loading world…</p>
    </div>
  </div>

  <!-- HUD (shown while exploring the 3D world) -->
  <div id="hud">
    <!-- Portal proximity label -->
    <div id="portal-label">
      <span id="portal-name"></span>
      <span id="portal-hint">Press <kbd>E</kbd> to enter</span>
    </div>

    <!-- Controls reminder (bottom-left) -->
    <div id="controls-hint">
      <span>WASD / Arrows — Move</span>
      <span>E — Enter portal</span>
    </div>
  </div>

  <!-- Photo gallery overlay (shown when inside a portal) -->
  <div id="gallery-overlay" class="hidden">
    <div id="gallery-header">
      <button id="gallery-close">← Back</button>
      <h2 id="gallery-category"></h2>
    </div>
    <div id="gallery-grid"></div>
  </div>

  <!-- Lightbox (inside gallery) -->
  <div id="lightbox" class="hidden">
    <button id="lightbox-close">✕</button>
    <img id="lightbox-img" src="" alt="" />
    <p id="lightbox-caption"></p>
  </div>

  <!-- WebGL canvas -->
  <canvas id="canvas"></canvas>

  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Game modules (order matters) -->
  <script src="js/controls.js"></script>
  <script src="js/player.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/universe.js"></script>
  <script src="main.js"></script>
</body>
</html>
